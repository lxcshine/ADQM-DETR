__include__: [
  '../dataset/dior_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/rtv2_optimizer.yml',
  '../base/rtv2_r50vd.yml',
]

output_dir: ./outputs/rtdetrv2_obb_hgnetv2_m_diorr

RTv4:
  backbone: HGNetv2
  decoder: RTDETRTransformerv2OBB

HGNetv2:
  name: 'B2'
  return_idx: [1, 2, 3]
  freeze_stem_only: False
  freeze_at: -1
  freeze_norm: False
  use_lab: True
  pretrained: True
  local_model_dir: ./pretrain/hgnetv2/

criterion: RTv4OBBCriterion

postprocessor: PostProcessorOBB

PostProcessorOBB:
  num_top_queries: 300
  input_shape: [800, 800]

HybridEncoder:
  in_channels: [384, 768, 1536]
  version: rt_detrv2
  expansion: 1
  depth_mult: 0.67

RTDETRTransformerv2OBB:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3
  num_layers: 3
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  learn_query_content: False
  eval_idx: -1
  num_points: [4, 4, 4]
  cross_attn_method: default
  query_select_method: default
  query_pos_method: default
  anchor_aspect_ratio: 1.0
  # ADQM 轴向质量预测头（论文公式 12-15，见 adqm/axis_quality_head.py）
  adqm:
    enabled: true
    lambda_aar: 1.0
    lambda_dir: 1.0
    direction_threshold: 0.5

RTv4OBBCriterion:
  weight_dict: {loss_focal: 1, loss_l1: 5, loss_kld: 5}
  losses: ['focal', 'l1', 'kld']
  alpha: 0.75
  gamma: 2.0
  use_uni_set: True
  # ADQM 轴向质量监督（论文公式 16-19，见 adqm/losses.py）：
  # total = L_det + lambda_aar * L_aar + lambda_dir * L_dir
  adqm:
    enabled: true
    lambda_aar: 1.0
    lambda_dir: 1.0
    direction_threshold: 0.5
  matcher:
    type: HungarianMatcherOBB
    weight_dict: {cost_class: 2, cost_bbox: 0, cost_hausdorff: 5, cost_giou: 5}
    alpha: 0.25
    gamma: 2.0

epoches: 102

lrsheduler: flatcosine
warmup_iter: -1
flat_epoch: 49
no_aug_epoch: 12

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00001
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

lr_warmup_scheduler: ~

train_dataloader:
  # 4060 8G 显存调优: batch=2 + AMP 实测峰值 2680MB, 按激活线性外推
  # batch=8 峰值约 6.8G（稳定约 6.5G），低于 8G 上限; 若实测偏高可用
  # -u train_dataloader.total_batch_size=6 回退
  total_batch_size: 8
  dataset:
    transforms:
      ops:
        - {type: MosaicOBB, output_size: 800, rotation_range: 0, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5],
           probability: 1.0, fill_value: 0, use_cache: False, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOutOBB, fill: 0}
        - {type: RandomIoUCropOBB, p: 0.8}
        - {type: RandomHorizontalFlipOBB}
        - {type: ResizeOBB, size: [800, 800]}
        - {type: SanitizeBoundingBoxesOBB, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertOBB, normalize: True}
      policy:
        epoch: [4, 49, 90]
        ops: ['MosaicOBB', 'RandomPhotometricDistort', 'RandomZoomOutOBB', 'RandomIoUCropOBB']
      mosaic_prob: 0.5

  collate_fn:
    base_size: 800
    base_size_repeat: ~
    mixup_prob: 0.5
    mixup_epochs: [4, 49]
    stop_epoch: 90
    ema_restart_decay: 0.9999

val_dataloader:
  # 覆盖 base/dataloader.yml 的 64: eval 为 fp32 前向，batch 16 显存约 3-4G，避免 OOM
  total_batch_size: 16
  dataset:
    transforms:
      ops:
        - {type: ResizeOBB, size: [800, 800], keep_ratio: True, pad_to_size: True, fill: 0}
        - {type: SanitizeBoundingBoxesOBB, min_size: 1.0}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertOBB, normalize: True}

use_swanlab: False
