task: detection

evaluator:
  type: DotaEvaluator
  iou_types: ['mAP']
  # 多 IoU 评测（COCO 10 阈值）: stats 返回 AP50 / AP75 / AP50_95 三键,
  # convergence.csv 三列均会记录; 单 epoch 评测耗时约增加 1-3 分钟
  iou_thrs: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]

num_classes: 20
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: DiorDataset
    img_folder: datasets/DIOR-R/JPEGImages-trainval
    ann_folder: datasets/DIOR-R/Annotations/Oriented Bounding Boxes
    ann_file:
      # full training: use train.txt + val.txt
      # - datasets/DIOR-R/ImageSets/Main/train.txt
      # - datasets/DIOR-R/ImageSets/Main/val.txt
      # smoke run (RTX 4060 8GB, 10 epochs): subset of train.txt + val.txt
      - datasets/DIOR-R/ImageSets/Main/train_smoke.txt
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction


val_dataloader:
  type: DataLoader
  dataset:
    type: DiorDataset
    img_folder: datasets/DIOR-R/JPEGImages-test
    ann_folder: datasets/DIOR-R/Annotations/Oriented Bounding Boxes
    # full evaluation: datasets/DIOR-R/ImageSets/Main/test.txt
    ann_file: datasets/DIOR-R/ImageSets/Main/test_smoke.txt
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
